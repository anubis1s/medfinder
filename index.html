<body>
<title>MedFinder Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; teal + gold like the desktop app */
:root{
  --bg:#E8E9EC; --card:#FFFFFF; --panel:#F3F4F6; --ink:#141519; --muted:#646A74;
  --accent:#0F766E; --accent-dark:#115E59; --accent-soft:#DDF3EF;
  --gold:#E0A526; --gold-dark:#8A5E05; --gold-soft:#FFF4D6;
  --red:#D92D30; --red-soft:#FDECEC; --green:#12804E; --green-soft:#E4F6EC;
  --hero1:#0E5F59; --hero2:#062E2B; --line:#ECEDEF;
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --fs:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:calc(15px*var(--fs));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.logo{width:40px;height:40px;border-radius:11px;box-shadow:0 4px 14px #F5B94255}
.brand{font-weight:700;font-size:1.15em;flex:1}
.circle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid #F7F7F8;flex:none}
.circle.red{background:var(--red);border:0;color:#fff}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);color:var(--gold-dark);border-radius:16px;padding:10px 14px;font-size:.87em;line-height:1.4;margin-bottom:14px}
.hint svg{flex:none;margin-top:1px}
h1{font-weight:500;font-size:1.9em;line-height:1.15;margin:4px 0 14px;text-wrap:balance}
h2{font-size:1em;font-weight:600;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cardx{background:var(--card);border-radius:24px;padding:16px;border:2px solid #F7F7F8}
.muted{color:var(--muted)}
.small{font-size:.85em}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-radius:28px;color:#fff;display:flex;align-items:center;padding:20px 8px 20px 20px;border:1.5px solid #E0A52666;overflow:hidden;position:relative}
.hero .t1{color:#BFE6DF;font-size:.95em}
.hero .t2{font-size:1.6em;font-weight:600;line-height:1.15;margin:6px 0 12px}
.heartbtn{position:relative;width:150px;height:150px;flex:none;display:grid;place-items:center}
.heartbtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#F5C35AAA 0%,#F5C35A33 50%,transparent 72%)}
.heartbtn img{position:relative;width:128px;height:128px;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(1)}36%{transform:scale(1.05)}48%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.heartbtn img{animation:none}}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:7px 12px;font-size:.85em;font-weight:600}
.gold{background:#FFE7A8;color:var(--gold-dark)}
.white{background:#fff;color:var(--ink)}
/* steps */
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

const isEmergency=t=>{t=t.toLowerCase();return EM.some(w=>t.includes(w))||EM_LOCAL.some(w=>t.includes(w))};
function dayList(){const out=[];const now=new Date();for(let i=0;i<7;i++){const d=new Date(now);d.setDate(now.getDate()+i);out.push(d)}return out}
const dayKey=d=>d.toLocaleDateString('en-GB',{weekday:'short'})+' '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
// Other (simulated) patients: each doctor has some slots already booked — stable per doctor, day and time
function h32(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function busy(id,day,time){const d=DOCS.find(x=>x.id==id);const r=d?d.rating:4.5;const rate=Math.min(70,Math.max(18,22+(r-3.9)*35))|0;
 return h32(id+'|'+day+'|'+time)%100<rate}
const mine=(id,day,time)=>S.bookings.some(b=>b.doctorId==id&&b.day===day&&b.time===time&&b.status!=='cancelled');
function isPast(dayIdx,time){if(dayIdx!==0)return false;const [h,m]=time.split(':').map(Number);const n=new Date();return h*60+m<=n.getHours()*60+n.getMinutes()+15}
const taken=(id,day,time)=>mine(id,day,time)||busy(id,day,time);
function slotState(id,dayIdx,time){const k=dayKey(dayList()[dayIdx]);if(isPast(dayIdx,time))return 'past';if(mine(id,k,time))return 'mine';if(busy(id,k,time))return 'busy';return 'free'}
function freeCount(id,dayIdx){return TIMES.filter(t=>slotState(id,dayIdx,t)==='free').length}
function nearest(d){const days=dayList();for(let i=0;i<days.length;i++){for(const t of TIMES){if(slotState(d.id,i,t)==='free')return(i===0?'today ':i===1?'tomorrow ':dayKey(days[i]).slice(0,3)+' ')+t}}return 'next week'}
function age(dob){const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(dob||'');if(!m)return null;const b=new Date(+m[3],m[2]-1,+m[1]);if(isNaN(b)||b>new Date())return null;let a=new Date().getFullYear()-b.getFullYear();const n=new Date();if(n.getMonth()<b.getMonth()||(n.getMonth()==b.getMonth()&&n.getDate()<b.getDate()))a--;return a}

const todayKey=()=>new Date().toISOString().slice(0,10);
// ---------- follow-up questions (rule-based triage, not a diagnosis) ----------
let TRI={dur:'',fever:'',sev:'',who:''};
function urgency(r){let sp=r.sp;if(TRI.who==='child'&&sp!=='Pediatrician'&&!['Dentist','Ophthalmologist','ENT','Psychotherapist'].includes(sp))sp='Pediatrician';
 let level='';const any=TRI.dur||TRI.fever||TRI.sev||TRI.who;
 if(any){if(TRI.sev==='severe'&&['Cardiologist','Pulmonologist','Neurologist'].includes(r.sp))level='sos';
  else if(TRI.sev==='severe'||(TRI.fever==='yes'&&TRI.who==='child')||(TRI.fever==='yes'&&TRI.dur==='week'))level='today';
  else if(TRI.fever==='yes'||TRI.dur==='week'||TRI.sev==='moderate')level='soon';else level='routine'}
 return{sp,level}}
function triageCard(u){const q=(key,label,opts)=>`<div style="margin-top:10px"><b class="small">${label}</b><div class="pills" style="margin-top:6px">${opts.map(([v,t])=>`<button class="pill ${TRI[key]===v?'on':''}" data-tri="${key}:${v}">${t}</button>`).join('')}</div></div>`;
 const box={sos:['banner sos',L('u_sos')],today:['banner',L('u_today')],soon:['banner info',L('u_soon')],routine:['banner ok',L('u_routine')]}[u.level];
 return `<div class="cardx" style="margin-top:12px"><b>${I('chat',18)} ${L('qtitle')}</b><div class="small muted">${L('qsub')}</div>
  ${q('dur',L('qdur'),[['day',L('d1')],['days',L('d2')],['week',L('d3')]])}${q('fever',L('qfev'),[['yes',L('yes')],['no',L('no')]])}
  ${q('sev',L('qsev'),[['mild',L('v1')],['moderate',L('v2')],['severe',L('v3')]])}${q('who',L('qwho'),[['adult',L('w1')],['child',L('w2')]])}
  ${box?`<div class="${box[0]}" style="margin-top:12px;${u.level==='today'?'background:#FFF1C9;color:#7A5200':''}">${u.level==='sos'?I('phone'):I('info')}<div>${box[1]}${u.level==='sos'?` <button class="btn danger" data-act="sos" style="min-height:36px;padding:6px 14px;margin-top:6px">103</button>`:''}</div></div>`:''}</div>`}
function starPick(n){return [1,2,3,4,5].map(i=>`<button type="button" class="big-star ${i<=n?'on':''}" data-star="${i}" aria-label="${i} of 5">★</button>`).join('')}
function usability(){const f=S.feedback;if(!f.length)return `<div class="cardx small muted">No answers yet. After each booking the app asks “How easy was it?”.</div>`;
 const e=f.filter(x=>x.ease),t=f.filter(x=>x.seconds),fd=f.filter(x=>x.found!==null&&x.found!==undefined);
 const box=(l,v)=>`<div class="fact"><small>${l}</small><b>${v}</b></div>`;
 return `<div class="cardx facts">${box('Answers',f.length)}${box('Ease (1–5)',e.length?(e.reduce((a,x)=>a+x.ease,0)/e.length).toFixed(1):'—')}${box('Found a doctor',fd.length?Math.round(100*fd.filter(x=>x.found).length/fd.length)+'%':'—')}${box('Time to book',t.length?Math.round(t.reduce((a,x)=>a+x.seconds,0)/t.length)+' s':'—')}</div>`}

 else if(ds.filter){filt={spec:'All',online:false,kids:false,budget:false,q:''};filt[ds.filter]=true;view='doctors';render()}
 else if(ds.doc)profile(ds.doc);
 else if(ds.book){if(!taskStart)taskStart=Date.now();booking(ds.book)}
 else if(ds.bookk){const [id,k]=ds.bookk.split(':');booking(id,k)}
 else if(ds.kind){bk.kind=ds.kind;drawBooking()}
 else if(ds.day){bk.day=+ds.day;bk.time=null;drawBooking()}
 else if(ds.time){bk.time=ds.time;drawBooking()}
 else if(ds.quick){closeSheet();view='find';doSearch(ds.quick)}
 else if(ds.spec){filt.spec=ds.spec;if(ds.gospec){filt={spec:ds.spec,online:false,kids:false,budget:false,q:''};view='doctors'}render()}
 else if(ds.tog){filt[ds.tog]=!filt[ds.tog];render()}
 else if(ds.star){fb.ease=+ds.star;$('#fbStars').innerHTML=starPick(fb.ease)}
 else if(ds.found!==undefined){fb.found=ds.found==='1';document.querySelectorAll('[data-found]').forEach(b=>b.classList.toggle('on',b===t))}
 else if(ds.deltag){const [k,i]=ds.deltag.split(':');S.card[k].splice(+i,1);save();render()}
 else if(ds.deldoc!==undefined){if(t.dataset.sure){S.card.documents.splice(+ds.deldoc,1);save();render()}else{t.dataset.sure=1;t.style.background='var(--red)';t.style.color='#fff';toast('Tap again to delete')}}
 else if(ds.cancel){if(t.dataset.sure){const b=S.bookings.find(x=>x.id==ds.cancel);b.status='cancelled';save();toast('Visit cancelled');render()}else{t.dataset.sure=1;t.textContent='Tap again to cancel';t.classList.add('danger');t.style.color='#fff'}}
 else if(ds.tri){const [k,v]=ds.tri.split(':');TRI[k]=TRI[k]===v?'':v;const y=window.scrollY;render();window.scrollTo(0,y)}
 else if(ds.pill!==undefined){const r=S.card.reminders[+ds.pill];r.taken=r.taken===todayKey()?'':todayKey();save();render()}
 else if(ds.delpill!==undefined){S.card.reminders.splice(+ds.delpill,1);save();render()}
 else if(ds.editdr)drForm(DOCS.find(x=>x.id==ds.editdr));
 else if(ds.editcl!==undefined)clForm(+ds.editcl);
 else if(ds.deldr){if(t.classList.contains('sure')){const i=DOCS.findIndex(x=>x.id==ds.deldr);DOCS.splice(i,1);touched()}else{t.classList.add('sure');t.textContent='Sure?'}}
 else if(ds.delcl!==undefined){if(t.classList.contains('sure')){DATA.clinics.splice(+ds.delcl,1);touched()}else{t.classList.add('sure');t.textContent='Sure?'}}
 else if(ds.act){({sos:sosSheet,adddr:()=>drForm(),lang:()=>{S.lang={en:'ru',ru:'uz',uz:'en'}[S.lang||'en'];save();render()},ownerin:()=>ownerIn(),duty:()=>dutyDoctor(),copyfb:()=>{const t=fbText(S.feedback);
   (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied — paste it into a message',true)).catch(()=>sheet(`<b>Copy this text</b><textarea class="lblta" style="min-height:160px" readonly>${esc(t)}</textarea><button class="btn ghost block" data-act="close">Close</button>`))},win:()=>getWindows(),addcl:()=>clForm(),ownpub:()=>ownerPublish(t),heart:heartSheet,menu:menuSheet,close:closeSheet,confirm:confirmBooking,sendfb:sendFeedback,editp:editProfile,adddoc:addDoc,
   clearf(){filt={spec:'All',online:false,kids:false,budget:false,q:''};render()},
   large(){S.large=!S.large;save();closeSheet();render()},
   logout(){closeSheet();S.name='';save();render()},
   wipe(){if(t.dataset.sure){try{localStorage.removeItem(KEY)}catch(e){}S=null;load();view='home';toast('All your data was deleted.',true);render()}else{t.dataset.sure=1;t.textContent='Tap again to delete everything'}}
  })[ds.act]?.()}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='onbForm'){const n=$('#nm').value.trim();if(!n){$('#onbErr').textContent='Please enter your name.';return}if(!$('#agree').checked){$('#onbErr').textContent='Please tick the box to continue.';return}S.name=n.slice(0,40);save();view='home';render()}
 else if(f.id==='findForm')doSearch($('#cmp').value);
 else if(f.id==='homeForm')doSearch($('#hq').value);
 else if(f.id==='pillForm'){const n=$('#pn').value.trim();if(!n)return;(S.card.reminders=S.card.reminders||[]).push({name:n.slice(0,40),time:$('#pt').value||'09:00',taken:''});S.card.reminders.sort((a,b)=>a.time.localeCompare(b.time));save();render()}
 else if(f.id==='tgForm'){const v=$('#tgu').value.trim().replace(/^@/,'');if(v&&!/^[A-Za-z0-9_]{4,32}$/.test(v)){toast('Username: 4–32 letters, digits or _');return}DATA.tg=v;toast('Saved — press Publish to apply it');touched()}
 else if(f.id==='noticeForm'){DATA.notice=$('#ntc').value.trim().slice(0,160);toast('Notice updated — press Publish to save it');touched()}
 else if(f.id==='drf'){const g=id=>$('#'+id).value.trim();const name=g('f_n'),e=+g('f_e'),r=+g('f_r'),p=+g('f_p');
  if(name.length<5){$('#drErr').textContent='Please enter the full name.';return}
  if(!(e>=0&&e<=60)){$('#drErr').textContent='Experience should be 0–60 years.';return}
  if(!(r>=1&&r<=5)){$('#drErr').textContent='Rating should be between 1 and 5.';return}
  if(!(p>=0&&p<=10000000)){$('#drErr').textContent='Please enter the price in UZS.';return}
  const split=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
  const v={name,specialty:g('f_s'),clinic:g('f_c')||'—',experience:e,rating:Math.round(r*10)/10,price:Math.round(p),languages:split(g('f_l')),education:g('f_ed'),focus:split(g('f_f')).slice(0,5),about:g('f_a'),online:$('#f_o').checked,kids:$('#f_k').checked};
  const file=$('#f_ph').files[0];const rm=$('#f_rm')?.checked;
  const finish=()=>{if(rm)v.photo='';if(f.dataset.id){Object.assign(DOCS.find(x=>x.id==f.dataset.id),v)}else{DOCS.push(Object.assign({id:Math.max(0,...DOCS.map(x=>x.id))+1,reviews:[]},v))}
   closeSheet();toast('Saved — press Publish to show it to everyone');touched()};
  if(file){(async()=>{const a=await window.claude?.use?.('assets');if(!a){$('#drErr').textContent='Photo upload is not available here.';return}
   $('#drErr').textContent='Uploading photo…';try{const r=await a.upload(file);v.photo=r.url;finish()}catch(e){$('#drErr').textContent='Could not upload the photo ('+(e&&e.code||'error')+').'}})();return}
  finish()}
 else if(f.id==='clf'){const g=id=>$('#'+id).value.trim();const name=g('c_n'),url=g('c_u');
  if(!name){$('#clErr').textContent='Please enter the clinic name.';return}
  if(!/^https?:\/\/[^\s.]+\.[^\s]+$/.test(url)){$('#clErr').textContent='Website must start with https:// or http://';return}
  const v={name,address:g('c_a'),what:g('c_w'),url,link:'Website',for:g('c_f').split(',').map(x=>x.trim()).filter(Boolean)};if(!v.for.length)v.for=['*'];
  if(f.dataset.i!=='')DATA.clinics[+f.dataset.i]=v;else DATA.clinics.push(v);closeSheet();toast('Saved — press Publish to show it to everyone');touched()}
 else if(f.dataset.addtag){const v=f.querySelector('input').value.trim();if(!v)return;const k=f.dataset.addtag;if(S.card[k].map(x=>x.toLowerCase()).includes(v.toLowerCase())){toast('Already added');return}S.card[k].push(v.slice(0,60));save();render()}
 else if(f.id==='fbForm'){fb.sec=null;sendFeedback()}
 else if(f.id==='pf'){const dob=$('#p_dob').value.trim(),h=$('#p_h').value.trim(),w=$('#p_w').value.trim();
  if(dob&&age(dob)===null){$('#pfErr').textContent='Date must look like 15.03.2008 and be in the past.';return}
  if(h&&!(+h>=40&&+h<=250)){$('#pfErr').textContent='Height should be between 40 and 250 cm.';return}
  if(w&&!(+w>=2&&+w<=300)){$('#pfErr').textContent='Weight should be between 2 and 300 kg.';return}
  Object.assign(S.card,{dob,sex:$('#p_sex').value,blood:$('#p_blood').value,height:h,weight:w,phone:$('#p_ph').value.trim(),emergency:$('#p_em').value.trim()});save();closeSheet();toast('Profile saved',true);render()}
 else if(f.id==='df'){const t=$('#d_t').value.trim();if(!t){$('#dfErr').textContent='Please enter a title.';return}const dt=$('#d_date').value;const file=$('#d_f').files[0];
  S.card.documents.push({title:t,type:$('#d_type').value,date:dt?dt.split('-').reverse().join('.'):new Date().toLocaleDateString('en-GB').replace(/\//g,'.'),file:file?file.name:''});save();closeSheet();toast('Document saved',true);render()}
});
document.addEventListener('input',e=>{if(e.target.id==='oq'){OWN.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#oq');n.focus();n.setSelectionRange(pos,pos);return}
 if(e.target.id==='dq'){filt.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#dq');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='sortSel'){sortBy=e.target.value;render()}});
function doSearch(text){text=(text||'').trim();view='find';
 if(!text){render();$('#findErr').textContent='Please describe your problem first.';return}
 if(!taskStart)taskStart=Date.now();
 TRI={dur:'',fever:'',sev:'',who:''};if(/\b(child|kid|baby|son|daughter)|ребён|ребен|сын|доч|bola/i.test(text))TRI.who='child';
 lastSearch=isEmergency(text)?{text,sos:true}:Object.assign({text},match(text));S.searches++;save();render()}
window.addEventListener('beforeunload',e=>{if(OWN.dirty){e.preventDefault();e.returnValue=''}});
setInterval(()=>{const b=$('#bpm');if(b)b.textContent=70+Math.floor(Math.random()*5)},2600);
render();
</script>
